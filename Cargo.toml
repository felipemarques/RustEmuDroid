[package]
name = "rustemudroid"
version = "0.25.0"
edition = "2024"

[features]
ui = ["dep:eframe", "dep:tonic", "dep:prost", "dep:tokio", "dep:bytemuck", "dep:rfd", "dep:serde", "dep:ash", "dep:gilrs", "dep:png", "dep:raw-window-handle"]

[dependencies]
png = { version = "0.18", optional = true }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tonic = { version = "0.12", optional = true, default-features = false, features = ["transport", "prost", "codegen"] }
prost = { version = "0.13", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "time", "sync", "macros"] }
bytemuck = { version = "1", optional = true }
rfd = { version = "0.15.4", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.20"
sha1 = "0.10"
sha2 = "0.10"
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded", "std"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_UI_Shell"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false }
