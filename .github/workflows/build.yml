name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            artifact: target/release/rustemudroid.exe
          - platform: Linux
            os: ubuntu-24.04
            artifact: rustemudroid-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Test desktop build
        run: cargo +stable test --locked --release --features ui

      - name: Build desktop executable
        run: cargo +stable build --locked --release --features ui

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        run: .\target\release\rustemudroid.exe --version

      - name: Package Linux executable with its execute permission
        if: runner.os == 'Linux'
        run: |
          ./target/release/rustemudroid --version
          tar -czf rustemudroid-linux-x86_64.tar.gz -C target/release rustemudroid

      - name: Upload desktop build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RustEmuDroid-${{ matrix.platform }}-x86_64
          path: ${{ matrix.artifact }}
          if-no-files-found: error
