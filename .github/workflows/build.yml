name: Android 9 platform runtime
on:
  push:
    branches: [lab/pie-platform-build]

concurrency:
  group: stock-pie-platform-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Build stock r61 runtime for both Android ABIs
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: tools/pie-build
      - name: Prepare the hosted Linux builder
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$RUNNER_TEMP/pie-src" "$RUNNER_TEMP/pie-result" "$RUNNER_TEMP/pie-bin"
          # The platform compiler and headers are supplied by the r61 manifest.
          # Reclaim the hosted runner's preinstalled mobile and .NET toolchains first.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf -- /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends repo libc6-i386 lib32z1 libtinfo5 libncurses5 ninja-build xsltproc libxml2-utils flex bison gperf zip unzip libxml2-dev
          sudo locale-gen en_US.UTF-8
          git config --global user.name 'AOSP build'
          git config --global user.email 'runner@localhost'
          git config --global http.version HTTP/1.1
          df -h "$RUNNER_TEMP"
      - name: Fetch source from the Android 9 r61 manifest
        run: |
          set -euo pipefail
          export LC_ALL=en_US.UTF-8
          cd "$RUNNER_TEMP/pie-src"
          exec > >(tee "$RUNNER_TEMP/pie-result/checkout.log") 2>&1
          repo init --no-clone-bundle --depth=1 --no-tags -u https://android.googlesource.com/platform/manifest -b refs/tags/android-9.0.0_r61
          test "$(git -C .repo/manifests rev-parse HEAD)" = 3564dc0e96454f300e34543781448fa4185682c5
          mapfile -t projects < "$GITHUB_WORKSPACE/tools/pie-build/projects.txt"
          repo sync -c -j4 --retry-fetches=2 --no-tags --no-clone-bundle --fail-fast "${projects[@]}" 2>&1 | tee "$RUNNER_TEMP/pie-result/sync.log"
          repo forall "${projects[@]}" -c 'printf "%s %s\n" "$REPO_PATH" "$(git rev-parse HEAD)"' > "$RUNNER_TEMP/pie-result/revisions.txt"
          cp "$GITHUB_WORKSPACE/tools/pie-build/projects.txt" "$RUNNER_TEMP/pie-result/projects.txt"
          repo manifest -o "$RUNNER_TEMP/pie-manifest.xml"
          python3 "$GITHUB_WORKSPACE/tools/pie-build/platform_checkout.py" "$RUNNER_TEMP/pie-manifest.xml" "$RUNNER_TEMP/pie-result"
          df -h "$RUNNER_TEMP"
      - name: Compile the two platform shared libraries
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/pie-src"
          exec > >(tee "$RUNNER_TEMP/pie-result/build.log") 2>&1
          export LC_ALL=en_US.UTF-8
          ln -s "$PWD/prebuilts/python/linux-x86/2.7.5/bin/python2.7" "$RUNNER_TEMP/pie-bin/python"
          ln -s "$PWD/prebuilts/python/linux-x86/2.7.5/bin/python2.7" "$RUNNER_TEMP/pie-bin/python2"
          export PATH="$RUNNER_TEMP/pie-bin:$PATH"
          python --version
          source build/envsetup.sh
          lunch sdk_phone_x86_64-userdebug
          report="$RUNNER_TEMP/pie-result"
          export NINJA_EXTRA_ARGS="-d keeprsp"
          repo list --all --path-only > "$RUNNER_TEMP/manifest-project-paths"
          while true; do
            if m -j3 libandroid_runtime 2>&1 | tee "$RUNNER_TEMP/last-build.log"; then
              break
            fi
            python3 "$GITHUB_WORKSPACE/tools/pie-build/missing_project_paths.py" \
              "$RUNNER_TEMP/last-build.log" "$RUNNER_TEMP/manifest-project-paths" "$report/projects.txt" > "$RUNNER_TEMP/missing-projects"
            mapfile -t needed < "$RUNNER_TEMP/missing-projects"
            if (( ${#needed[@]} == 0 )); then
              python3 "$GITHUB_WORKSPACE/tools/pie-build/blueprint_providers.py" \
                "$RUNNER_TEMP/last-build.log" "$RUNNER_TEMP/pie-manifest.xml" "$RUNNER_TEMP/module-index.json" "$report/projects.txt" > "$RUNNER_TEMP/missing-projects"
              mapfile -t needed < "$RUNNER_TEMP/missing-projects"
              (( ${#needed[@]} > 0 )) || exit 1
            fi
            printf 'Fetching missing source project: %s\n' "${needed[@]}"
            repo sync -c -j4 --retry-fetches=2 --no-tags --no-clone-bundle --fail-fast "${needed[@]}"
            printf '%s\n' "${needed[@]}" >> "$report/projects.txt"
            repo forall "${needed[@]}" -c 'printf "%s %s\n" "$REPO_PATH" "$(git rev-parse HEAD)"' >> "$report/revisions.txt"
          done
          for abi in lib lib64; do
            output="$ANDROID_PRODUCT_OUT/system/$abi/libandroid_runtime.so"
            test -s "$output"
            mkdir -p "$report/$abi"
            cp "$output" "$report/$abi/"
            readelf -h -d "$output" > "$report/$abi/elf.txt"
          done
          grep -q ELF32 "$report/lib/elf.txt"
          grep -q 'Intel 80386' "$report/lib/elf.txt"
          grep -q ELF64 "$report/lib64/elf.txt"
          grep -q 'X86-64' "$report/lib64/elf.txt"
          (cd "$report" && sha256sum lib/libandroid_runtime.so lib64/libandroid_runtime.so > SHA256SUMS)
      - name: Collect stock compile and link input records
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/pie-src"
          python3 "$GITHUB_WORKSPACE/tools/pie-build/runtime_build_inputs.py" "$RUNNER_TEMP/pie-result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: aosp-pie-platform
          path: ${{ runner.temp }}/pie-result/
          retention-days: 7
          if-no-files-found: ignore
