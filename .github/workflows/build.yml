name: Desktop builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            archive: windows-x86_64.zip
          - platform: Linux
            os: ubuntu-24.04
            archive: linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Resolve the Cargo version and verify release tags
        id: package
        shell: pwsh
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive }}
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'rustemudroid').version
          if (-not $version) { throw 'Cargo metadata is missing the RustEmuDroid package version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Expected a stable SemVer tag matching Cargo version $version, got $env:GITHUB_REF_NAME"
            }
          }
          "archive=RustEmuDroid-v$version-$env:ARCHIVE_SUFFIX" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Test desktop build
        run: cargo +stable test --locked --release --features ui

      - name: Check the isolated Windows DWM viewer
        if: runner.os == 'Windows'
        run: |
          cargo +stable fmt --manifest-path experiments/dwm-native-viewer/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable test --locked --release --manifest-path experiments/dwm-native-viewer/Cargo.toml --target-dir "$env:RUNNER_TEMP/dwm-lab"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --release --manifest-path experiments/dwm-native-viewer/Cargo.toml --target-dir "$env:RUNNER_TEMP/dwm-lab"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/dwm-lab/release/dwm-native-viewer.exe" --help

      - name: Upload the standalone DWM viewer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-DWM-viewer
          path: ${{ runner.temp }}/dwm-lab/release/dwm-native-viewer.exe
          if-no-files-found: error

      - name: Test repository tools
        run: python -B -m unittest discover -s tools -p 'test_*.py'

      - name: Build desktop executable
        run: cargo +stable build --locked --release --features ui

      - name: Package and verify desktop distribution
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $binary = if ($IsWindows) { 'rustemudroid.exe' } else { 'rustemudroid' }
          $toolFiles = @(
            'Test-BlueStacksData.ps1',
            'bluestacks_data_probe.py',
            'bluestacks_qemu.py'
          )
          $package = Join-Path $env:RUNNER_TEMP 'rustemudroid-package'
          $verify = Join-Path $env:RUNNER_TEMP 'rustemudroid-extracted'
          $tools = Join-Path $package 'tools'
          New-Item -ItemType Directory -Path $tools, $verify | Out-Null
          Copy-Item -LiteralPath "target/release/$binary" -Destination $package
          if ($IsWindows) {
            Copy-Item -LiteralPath 'android/scrcpy/LICENSE.txt' -Destination (Join-Path $tools 'scrcpy-LICENSE.txt')
          }
          foreach ($file in $toolFiles) {
            Copy-Item -LiteralPath "tools/$file" -Destination $tools
          }
          $guide = @'
          # BlueStacks read-only storage check

          Run the check from the extracted folder that contains `rustemudroid` or `rustemudroid.exe` and `tools/`. Shut down the BlueStacks Pie64 instance and put copies of `fastboot.vdi` and `Data_orig.vhdx` in a `Pie64` folder beside `tools/`. Keep disk images, manifests and run outputs private.

          Install Python 3.11 or later, QEMU for x86-64 and `qemu-img` on Linux or in Ubuntu 24.04 under WSL, the Windows helper's default distribution. Choose a new output directory for each run.

          On Windows, run

          ```powershell
          powershell -ExecutionPolicy Bypass -File .\tools\Test-BlueStacksData.ps1 -Images .\Pie64 -Output .\data-check
          Get-Content .\data-check\result.json
          ```

          On Linux or WSL, run

          ```sh
          python3 -B tools/bluestacks_data_probe.py --images ./Pie64 --output ./data-check
          cat ./data-check/result.json
          ```

          The probe accepts only the exact validated Pie64 image pair and checks its two SHA-256 hashes automatically. If the copies already have a `manifest.json`, you can add `-VerifyHashes` to the Windows probe command to check those hashes against the manifest too. The manifest is a JSON array with one entry per image and the fields `file` (filename), `bytes` (size as an integer) and `sha256` (digest recorded when the copy was made).

          A value of `true` for `factory_ext4_mounted_read_only` in `result.json` means the diagnostic guest mounted the factory ext4 data filesystem read-only. This result covers the filesystem mount. Use `--help` or `Get-Help .\tools\Test-BlueStacksData.ps1` for the available options.

          [Storage probe documentation for this build]({GUIDE_URL})
          '@
          $guideUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/bluestacks-lab.md#opt-in-data-storage-probe"
          Set-Content -LiteralPath (Join-Path $tools 'README.md') -Value $guide.Replace('{GUIDE_URL}', $guideUrl) -Encoding utf8

          $archive = Join-Path $PWD $env:ARCHIVE
          if ($IsWindows) {
            Compress-Archive -LiteralPath @((Join-Path $package $binary), $tools) -DestinationPath $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $verify
          } else {
            chmod 755 (Join-Path $package $binary)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -czf $archive -C $package $binary tools
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -xzf $archive -C $verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $expected = @($binary, 'tools/README.md') + @($toolFiles | ForEach-Object { "tools/$_" })
          if ($IsWindows) { $expected += 'tools/scrcpy-LICENSE.txt' }
          $actual = Get-ChildItem -LiteralPath $verify -File -Force -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($verify, $_.FullName).Replace('\', '/')
          }
          if (Compare-Object $expected $actual -CaseSensitive) { throw 'Unexpected package contents' }
          Push-Location -LiteralPath $verify
          try {
            $reportedVersion = & (Join-Path $verify $binary) --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($reportedVersion -cne "rustemudroid $env:VERSION") { throw "Unexpected executable version: $reportedVersion" }
            $previewRoot = Join-Path $env:RUNNER_TEMP 'runtime-preview-only'
            foreach ($profile in 'original', 'google-play') {
              $plan = & (Join-Path $verify $binary) --lang en-us runtime-setup --image $profile --destination $previewRoot
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve $profile from Google's catalog" }
              if ($plan[0] -notmatch '^system-images;android-.+;x86_64$' -or $plan[-1] -notmatch '--accept-license') { throw "Incomplete $profile preview" }
              if (Test-Path -LiteralPath $previewRoot) { throw 'Preview wrote a runtime directory before consent' }
              Write-Output "Setup preview: $($plan[0]), $($plan[2])"
            }
            $python = if ($IsWindows) { 'python' } else { 'python3' }
            $labHelp = (& $python -B tools/bluestacks_data_probe.py --help) -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($option in '--images', '--output') {
              if (-not $labHelp.Contains($option)) { throw "Missing data probe option: $option" }
            }
            if ($IsWindows) {
              $wrapper = Get-Command (Join-Path $verify 'tools/Test-BlueStacksData.ps1')
              foreach ($option in 'Images', 'Output', 'VerifyHashes') {
                if (-not $wrapper.Parameters.ContainsKey($option)) { throw "Missing PowerShell data probe option: $option" }
              }
            }
          } finally {
            Pop-Location
          }

      - name: Install the Google Play runtime with the packaged Windows executable
        if: runner.os == 'Windows' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'rustemudroid-extracted/rustemudroid.exe'
          $runtime = Join-Path $env:RUNNER_TEMP 'runtime-play'
          $profile = Join-Path $env:RUNNER_TEMP 'profile-play'
          $licenses = Join-Path $env:ANDROID_HOME 'licenses'
          & $exe --lang en-us runtime-setup --image google-play --licenses-from $licenses --destination $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --lang en-us --sdk $runtime --state-dir $profile init --image 'system-images;android-37.0;google_apis_playstore;x86_64'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $image = Join-Path $runtime 'system-images/android-37.0/google_apis_playstore/x86_64'
          if (!(Test-Path -LiteralPath (Join-Path $image 'system.img') -PathType Leaf)) { throw 'Play image missing' }
          $config = Get-Content -LiteralPath (Join-Path $profile 'avd/RustEmuDroid.avd/config.ini')
          if (!($config -match '^image\.sysdir\.1=system-images[/\\]android-37\.0[/\\]google_apis_playstore[/\\]x86_64[/\\]?$')) { throw 'AVD did not select the downloaded Google Play image' }
          Get-Content -LiteralPath (Join-Path $image 'source.properties') |
            Select-String -Pattern '^Pkg.Revision=','^AndroidVersion.ApiLevel=','^SystemImage.TagId='

      - name: Upload desktop build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RustEmuDroid-${{ matrix.platform }}-x86_64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          overwrite: true

      - name: Collect the Linux runtime installation test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable test --locked --release --features ui --no-run --message-format=json > "$RUNNER_TEMP/cargo-tests.jsonl"
          harness=$(jq -ers '[.[] | select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "rustemudroid") | .executable | select(type == "string")] | unique | if length == 1 then .[0] else error("Expected one RustEmuDroid test executable") end' "$RUNNER_TEMP/cargo-tests.jsonl")
          install -m 755 "$harness" "$RUNNER_TEMP/runtime-install-test"
          "$RUNNER_TEMP/runtime-install-test" --list --ignored offline_installed_runtime_round_trip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: linux-runtime-install-test
          path: ${{ runner.temp }}/runtime-install-test
          retention-days: 1
          if-no-files-found: error

  portable-linux:
    name: Boot the packaged Linux client
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.desktop.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RustEmuDroid-Linux-x86_64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: linux-runtime-install-test
          path: ${{ runner.temp }}/test-bin

      - name: Prepare a portable Android 15 AOSP runtime
        shell: bash
        run: |
          set -eu -o pipefail
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          app="$RUNNER_TEMP/rustemudroid"
          mkdir -p "$app" "$RUNNER_TEMP/guest-home" "$RUNNER_TEMP/boot-report" "$GITHUB_WORKSPACE/.rustemudroid/qa"
          tar -xzf "RustEmuDroid-v$VERSION-linux-x86_64.tar.gz" -C "$app"
          "$app/rustemudroid" --lang en-us runtime-setup --image original --licenses-from "$ANDROID_HOME/licenses" --destination "$app/runtime" 2>&1 |
            tee "$RUNNER_TEMP/boot-report/runtime-download.txt"
          export RUSTEMUDROID_TEST_SDK_SOURCE="$app/runtime"
          export RUSTEMUDROID_TEST_SDK_PACKAGE='system-images;android-35;default;x86_64'
          export RUSTEMUDROID_TEST_RUNTIME_DEST="$GITHUB_WORKSPACE/.rustemudroid/qa/install-smoke"
          chmod +x "$RUNNER_TEMP/test-bin/runtime-install-test"
          "$RUNNER_TEMP/test-bin/runtime-install-test" offline_installed_runtime_round_trip --ignored --nocapture 2>&1 |
            tee "$RUNNER_TEMP/boot-report/runtime-install.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/boot-report/runtime-install.txt"

      - name: Check discovery, guest boot and shutdown
        shell: bash
        run: |
          set -eu -o pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_AVD_HOME ANDROID_USER_HOME
          export HOME="$RUNNER_TEMP/guest-home" PATH=/usr/bin:/bin
          app="$RUNNER_TEMP/rustemudroid"
          report="$RUNNER_TEMP/boot-report"
          cli=("$app/rustemudroid" --lang en-us --state-dir "$RUNNER_TEMP/profile")
          cd "$HOME"
          "${cli[@]}" doctor | tee "$report/doctor.txt"
          grep -Fx "Portable: $app/runtime" "$report/doctor.txt"
          "${cli[@]}" init
          grep -Fx 'image.sysdir.1=system-images/android-35/default/x86_64/' "$RUNNER_TEMP/profile/avd/RustEmuDroid.avd/config.ini"
          adb="$app/runtime/platform-tools/adb"
          "$adb" start-server
          "${cli[@]}" boot --headless --check --gpu swiftshader --timeout 300 | tee "$report/boot.txt"
          grep -F 'sys.boot_completed=1' "$report/boot.txt"
          serial=$(sed -n 's/.*(\(emulator-[0-9]*\), Android .*/\1/p' "$report/boot.txt")
          test -n "$serial"
          for attempt in {1..10}; do
            "$adb" devices > "$report/devices-after.txt"
            if ! grep -q "^$serial[[:space:]]" "$report/devices-after.txt"; then break; fi
            sleep 1
          done
          if grep -q "^$serial[[:space:]]" "$report/devices-after.txt"; then exit 1; fi
          cat "$report/boot.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/tests

      - name: Check the desktop mouse wheel, control profiles and Android FPS
        shell: bash
        run: |
          set -eu -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool libgl1-mesa-dri libxkbcommon-x11-0
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s '-screen 0 1280x800x24' python3 -u tools/tests/home_wheel.py | tee "$RUNNER_TEMP/boot-report/home-wheel.txt"
          cat "$RUNNER_TEMP/boot-report/home-wheel.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Linux-portable-boot
          path: |
            ${{ runner.temp }}/boot-report/*.txt
            ${{ runner.temp }}/profile/boot-*.log
          if-no-files-found: ignore

  dependency-policy:
    name: Check dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_DENY_VERSION: 0.18.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install the pinned dependency checker
        run: cargo +stable install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Check licenses and security advisories against deny.toml
        run: cargo +stable deny check licenses advisories

  release-plan:
    name: Resolve release target
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [desktop, portable-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify version increases on main
        id: plan
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          def stable_version(version):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
                  raise SystemExit(f"Expected a stable SemVer version, got {version}")
              return tuple(map(int, version.split(".")))

          current = os.environ["VERSION"]
          if os.environ["GITHUB_REF_TYPE"] == "branch":
              previous_sha = os.environ["PREVIOUS_SHA"]
              if previous_sha == "0" * 40:
                  print("Main was created without a previous commit to compare.")
                  raise SystemExit(0)
              previous_manifest = subprocess.check_output(
                  ["git", "show", f"{previous_sha}:Cargo.toml"], text=True
              )
              previous = tomllib.loads(previous_manifest)["package"]["version"]
              if current == previous:
                  print(f"Cargo remains at {current}.")
                  raise SystemExit(0)
              if stable_version(current) <= stable_version(previous):
                  raise SystemExit(f"Cargo version must increase from {previous}, got {current}")

          stable_version(current)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD^{commit}"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag=v{current}", file=output)
              print(f"commit={commit}", file=output)
          PY

  release:
    name: Publish GitHub Release
    if: needs.release-plan.outputs.tag != ''
    needs: release-plan
    concurrency:
      group: desktop-release-${{ needs.release-plan.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RustEmuDroid-*-x86_64
          path: dist
          merge-multiple: true

      - name: Verify both archives and tag the tested commit
        shell: bash
        env:
          TAG: ${{ needs.release-plan.outputs.tag }}
          COMMIT: ${{ needs.release-plan.outputs.commit }}
        run: |
          test -s "dist/RustEmuDroid-$TAG-windows-x86_64.zip"
          test -s "dist/RustEmuDroid-$TAG-linux-x86_64.tar.gz"

          ref="refs/tags/$TAG"
          tag_commit() {
            git ls-remote origin "$ref" "$ref^{}" |
              awk -v tag="$ref" '$2 == tag { direct = $1 } $2 == tag "^{}" { peeled = $1 } END { print peeled ? peeled : direct }'
          }
          existing_commit=$(tag_commit)
          if [[ -z "$existing_commit" ]]; then
            git push origin "$COMMIT:$ref"
            existing_commit=$(tag_commit)
          fi
          if [[ "$existing_commit" != "$COMMIT" ]]; then
            echo "::error::$TAG points to $existing_commit, expected $COMMIT"
            exit 1
          fi

      - name: Publish both verified archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plan.outputs.tag }}
          COMMIT: ${{ needs.release-plan.outputs.commit }}
        run: |
          windows="dist/RustEmuDroid-$TAG-windows-x86_64.zip"
          linux="dist/RustEmuDroid-$TAG-linux-x86_64.tar.gz"

          release_json() {
            gh release view "$TAG" --json isDraft,assets
          }
          if ! release=$(release_json); then
            notes=(--generate-notes)
            if [[ -f "docs/releases/$TAG.md" ]]; then
              python3 tools/release_notes.py "docs/releases/$TAG.md" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$COMMIT" "$RUNNER_TEMP/release-notes.md"
              notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
            fi
            gh release create "$TAG" --verify-tag --target "$COMMIT" --draft --title "RustEmuDroid $TAG" "${notes[@]}"
            release=$(release_json)
          fi
          draft=$(jq -r '.isDraft' <<< "$release")
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" "$windows" "$linux" --clobber
            release=$(release_json)
          fi
          jq -e --arg windows "${windows##*/}" --arg linux "${linux##*/}" '
            [.assets[] | select(.state == "uploaded" and .size > 0) | .name]
            | index($windows) != null and index($linux) != null
          ' <<< "$release"
          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
