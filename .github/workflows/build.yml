name: Desktop builds

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }} x86-64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            archive: windows-x86_64.zip
          - platform: Linux
            os: ubuntu-24.04
            archive: linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Resolve the Cargo version and verify release tags
        id: package
        shell: pwsh
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive }}
        run: |
          $metadata = cargo +stable metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'rustemudroid').version
          if (-not $version) { throw 'Cargo metadata is missing the RustEmuDroid package version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' -or $env:GITHUB_REF_NAME -cne "v$version") {
              throw "Expected a stable SemVer tag matching Cargo version $version, got $env:GITHUB_REF_NAME"
            }
          }
          "archive=RustEmuDroid-v$version-$env:ARCHIVE_SUFFIX" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Test desktop build
        run: cargo +stable test --locked --release --features ui

      - name: Test read-only storage diagnostic
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tools -p test_bluestacks_data_probe.py

      - name: Build desktop executable
        run: cargo +stable build --locked --release --features ui

      - name: Package and verify desktop distribution
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          $binary = if ($IsWindows) { 'rustemudroid.exe' } else { 'rustemudroid' }
          $toolFiles = @(
            'Test-BlueStacksData.ps1',
            'bluestacks_data_probe.py',
            'bluestacks_qemu.py'
          )
          $package = Join-Path $env:RUNNER_TEMP 'rustemudroid-package'
          $verify = Join-Path $env:RUNNER_TEMP 'rustemudroid-extracted'
          $tools = Join-Path $package 'tools'
          New-Item -ItemType Directory -Path $tools, $verify | Out-Null
          Copy-Item -LiteralPath "target/release/$binary" -Destination $package
          foreach ($file in $toolFiles) {
            Copy-Item -LiteralPath "tools/$file" -Destination $tools
          }
          $guide = @'
          # BlueStacks read-only storage check

          Run the check from the extracted folder that contains `rustemudroid` or `rustemudroid.exe` and `tools/`. Shut down the BlueStacks Pie64 instance and put copies of `fastboot.vdi` and `Data_orig.vhdx` in a `Pie64` folder beside `tools/`. Keep disk images, manifests and run outputs private.

          Install Python 3.11 or later, QEMU for x86-64 and `qemu-img` on Linux or in Ubuntu 24.04 under WSL, the Windows helper's default distribution. Choose a new output directory for each run.

          On Windows, run

          ```powershell
          powershell -ExecutionPolicy Bypass -File .\tools\Test-BlueStacksData.ps1 -Images .\Pie64 -Output .\data-check
          Get-Content .\data-check\result.json
          ```

          On Linux or WSL, run

          ```sh
          python3 -B tools/bluestacks_data_probe.py --images ./Pie64 --output ./data-check
          cat ./data-check/result.json
          ```

          The probe accepts only the exact validated Pie64 image pair and checks its two SHA-256 hashes automatically. If the copies already have a `manifest.json`, you can add `-VerifyHashes` to the Windows probe command to check those hashes against the manifest too. The manifest is a JSON array with one entry per image and the fields `file` (filename), `bytes` (size as an integer) and `sha256` (digest recorded when the copy was made).

          A value of `true` for `factory_ext4_mounted_read_only` in `result.json` means the diagnostic guest mounted the factory ext4 data filesystem read-only. This result covers the filesystem mount. Use `--help` or `Get-Help .\tools\Test-BlueStacksData.ps1` for the available options.

          [Storage probe documentation for this build]({GUIDE_URL})
          '@
          $guideUrl = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/bluestacks-lab.md#opt-in-data-storage-probe"
          Set-Content -LiteralPath (Join-Path $tools 'README.md') -Value $guide.Replace('{GUIDE_URL}', $guideUrl) -Encoding utf8

          $archive = Join-Path $PWD $env:ARCHIVE
          if ($IsWindows) {
            Compress-Archive -LiteralPath @((Join-Path $package $binary), $tools) -DestinationPath $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $verify
          } else {
            chmod 755 (Join-Path $package $binary)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -czf $archive -C $package $binary tools
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -xzf $archive -C $verify
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $expected = @($binary, 'tools/README.md') + @($toolFiles | ForEach-Object { "tools/$_" })
          $actual = Get-ChildItem -LiteralPath $verify -File -Force -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($verify, $_.FullName).Replace('\', '/')
          }
          if (Compare-Object $expected $actual -CaseSensitive) { throw 'Unexpected package contents' }
          Push-Location -LiteralPath $verify
          try {
            $reportedVersion = & (Join-Path $verify $binary) --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($reportedVersion -cne "rustemudroid $env:VERSION") { throw "Unexpected executable version: $reportedVersion" }
            $python = if ($IsWindows) { 'python' } else { 'python3' }
            $labHelp = (& $python -B tools/bluestacks_data_probe.py --help) -join "`n"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            foreach ($option in '--images', '--output') {
              if (-not $labHelp.Contains($option)) { throw "Missing data probe option: $option" }
            }
            if ($IsWindows) {
              $wrapper = Get-Command (Join-Path $verify 'tools/Test-BlueStacksData.ps1')
              foreach ($option in 'Images', 'Output', 'VerifyHashes') {
                if (-not $wrapper.Parameters.ContainsKey($option)) { throw "Missing PowerShell data probe option: $option" }
              }
            }
          } finally {
            Pop-Location
          }

      - name: Upload desktop build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RustEmuDroid-${{ matrix.platform }}-x86_64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          overwrite: true

  release-plan:
    name: Resolve release target
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify version increases on main
        id: plan
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
          VERSION: ${{ needs.desktop.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          def stable_version(version):
              if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
                  raise SystemExit(f"Expected a stable SemVer version, got {version}")
              return tuple(map(int, version.split(".")))

          current = os.environ["VERSION"]
          if os.environ["GITHUB_REF_TYPE"] == "branch":
              previous_sha = os.environ["PREVIOUS_SHA"]
              if previous_sha == "0" * 40:
                  print("Main was created without a previous commit to compare.")
                  raise SystemExit(0)
              previous_manifest = subprocess.check_output(
                  ["git", "show", f"{previous_sha}:Cargo.toml"], text=True
              )
              previous = tomllib.loads(previous_manifest)["package"]["version"]
              if current == previous:
                  print(f"Cargo remains at {current}.")
                  raise SystemExit(0)
              if stable_version(current) <= stable_version(previous):
                  raise SystemExit(f"Cargo version must increase from {previous}, got {current}")

          stable_version(current)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD^{commit}"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag=v{current}", file=output)
              print(f"commit={commit}", file=output)
          PY

  release:
    name: Publish GitHub Release
    if: needs.release-plan.outputs.tag != ''
    needs: release-plan
    concurrency:
      group: desktop-release-${{ needs.release-plan.outputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: RustEmuDroid-*-x86_64
          path: dist
          merge-multiple: true

      - name: Verify both archives and tag the tested commit
        shell: bash
        env:
          TAG: ${{ needs.release-plan.outputs.tag }}
          COMMIT: ${{ needs.release-plan.outputs.commit }}
        run: |
          test -s "dist/RustEmuDroid-$TAG-windows-x86_64.zip"
          test -s "dist/RustEmuDroid-$TAG-linux-x86_64.tar.gz"

          ref="refs/tags/$TAG"
          tag_commit() {
            git ls-remote origin "$ref" "$ref^{}" |
              awk -v tag="$ref" '$2 == tag { direct = $1 } $2 == tag "^{}" { peeled = $1 } END { print peeled ? peeled : direct }'
          }
          existing_commit=$(tag_commit)
          if [[ -z "$existing_commit" ]]; then
            git push origin "$COMMIT:$ref"
            existing_commit=$(tag_commit)
          fi
          if [[ "$existing_commit" != "$COMMIT" ]]; then
            echo "::error::$TAG points to $existing_commit, expected $COMMIT"
            exit 1
          fi

      - name: Publish both verified archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-plan.outputs.tag }}
          COMMIT: ${{ needs.release-plan.outputs.commit }}
        run: |
          windows="dist/RustEmuDroid-$TAG-windows-x86_64.zip"
          linux="dist/RustEmuDroid-$TAG-linux-x86_64.tar.gz"

          release_json() {
            gh release view "$TAG" --json isDraft,assets
          }
          if ! release=$(release_json); then
            notes=(--generate-notes)
            if [[ -f "docs/releases/$TAG.md" ]]; then
              notes=(--notes-file "docs/releases/$TAG.md")
            fi
            gh release create "$TAG" --verify-tag --target "$COMMIT" --draft --title "RustEmuDroid $TAG" "${notes[@]}"
            release=$(release_json)
          fi
          draft=$(jq -r '.isDraft' <<< "$release")
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" "$windows" "$linux" --clobber
            release=$(release_json)
          fi
          jq -e --arg windows "${windows##*/}" --arg linux "${linux##*/}" '
            [.assets[] | select(.state == "uploaded" and .size > 0) | .name]
            | index($windows) != null and index($linux) != null
          ' <<< "$release"
          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --draft=false
          fi
