# Dependency policy: the licenses the dependencies may use and the security
# advisories they must be free of. The build workflow checks it.
# RustEmuDroid is AGPL-3.0-only, so each dependency needs a license that can be
# combined with it. A dependency with several licenses to choose from passes
# when one of them is allowed here.

[graph]
# The published builds: x86-64 Windows and Linux with the desktop UI.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
ignore = []

[licenses]
# Permissive licenses, and MPL-2.0, whose files can be combined with the AGPL.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Licenses kept on the list for future dependencies are not an error.
unused-allowed-license = "allow"
confidence-threshold = 0.93
exceptions = [
    # RustEmuDroid itself.
    { crate = "rustemudroid", allow = ["AGPL-3.0-only"] },
    # The fonts embedded in the desktop UI keep their own font licenses, which
    # allow them to be bundled with any software as long as the license texts
    # travel with them.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
    # The trusted root certificates for downloads are data under a permissive
    # data license that asks for its text to travel with the data.
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]
